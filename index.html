/* =========================================================

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let W, H, DPR;
let season = 0;
let manualSeason = false;
let night = false;
let weatherKind = "clear";
let weatherReady = false;

function rnd(n) {
    const value = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return value - Math.floor(value);
}

function resize() {
    W = innerWidth;
    H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize);
resize();

function oval(x, y, rx, ry, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
}

function box(x, y, w, h, radius, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, radius);
    ctx.fill();
}

function line(x1, y1, x2, y2, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

function point(x, z) {
    return {
        x: W / 2 + (x - 0.5) * W * (0.7 + z * 0.55),
        y: H * 0.32 + z * H * 0.59,
        s: Math.min(W / 1000, H / 740) * (0.48 + z * 0.9)
    };
}

function koreanParts() {
    const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul",
        month: "numeric",
        hour: "numeric",
        hourCycle: "h23"
    }).formatToParts(new Date());

    return Object.fromEntries(parts.map(part => [part.type, part.value]));
}

function actualSeason() {
    const month = Number(koreanParts().month);
    if (month >= 3 && month <= 5) return 0;
    if (month >= 6 && month <= 8) return 1;
    if (month >= 9 && month <= 11) return 2;
    return 3;
}

function updateCaption() {
    const names = ["봄", "여름", "가을", "겨울"];
    const caption = document.getElementById("caption");

    if (!weatherReady) {
        caption.textContent = weatherState === "error"
            ? `${names[season]} 풍경을 산책해요. 현재 날씨 연결을 기다리고 있어요.`
            : `${names[season]} 풍경을 산책해요. 현재 날씨를 확인하고 있어요.`;
        return;
    }

    const city = document.getElementById("city");
    const cityName = city.selectedOptions[0].textContent;
    let message = (MESSAGES[weatherKind] || MESSAGES.clear)[season];

    if (night && ["clear", "cloudy"].includes(weatherKind)) {
        const nightMessages = [
            "봄밤의 숲에서 잠시 쉬어갈까요?",
            "초록이 잠든 여름밤을 함께 걸어요.",
            "가을밤의 고요함을 함께 느껴봐요.",
            "겨울밤의 숲에서 따뜻한 이야기를 나눠요."
        ];
        message = `${weatherKind === "cloudy" ? "오늘은 구름 많은 밤이에요." : "오늘은 맑은 밤이에요."} ${nightMessages[season]}`;
    }

    caption.textContent = `${cityName} · ${message}`;
}

function updateSeasonUI() {
    document.querySelectorAll("[data-season]").forEach(button => {
        const selected = Number(button.dataset.season) === season;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
    });
    document.getElementById("auto").textContent = manualSeason ? "오늘" : "오늘 기준";
    updateCaption();
}

function weatherDescription(code) {
    if (code === 0) return "맑음";
    if (code <= 2) return "구름 조금";
    if (code === 3) return "흐림";
    if ([45, 48].includes(code)) return "안개";
    if ([71, 73, 75, 77, 85, 86].includes(code)) return "눈";
    if ([95, 96, 99].includes(code)) return "뇌우";
    if ([51, 53, 55, 56, 57].includes(code)) return "이슬비";
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "비";
    return "날씨 정보";
}

function kindFromCode(code) {
    if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
    if ([95, 96, 99].includes(code)) return "storm";
    if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "rain";
    if ([45, 48].includes(code)) return "fog";
    if ([2, 3].includes(code)) return "cloudy";
    return "clear";
}

async function loadWeather() {
    const id = ++requestId;
    if (activeController) activeController.abort();

    const controller = new AbortController();
    activeController = controller;

    weatherReady = false;
    weatherState = "loading";
    weatherKind = "clear";
    cloudCover = 0;

    const hour = Number(koreanParts().hour);
    night = hour < 6 || hour >= 18;
    updateCaption();

    document.getElementById("weather-text").textContent = "날씨 불러오는 중…";
    document.getElementById("weather-status").textContent = "선택한 지역의 날씨를 확인해요.";

    const [latitude, longitude] = CITIES[document.getElementById("city").value];
    const params = new URLSearchParams({
        latitude,
        longitude,
        current: "temperature_2m,weather_code,is_day,cloud_cover",
        timezone: "Asia/Seoul"
    });

    const timeout = setTimeout(() => controller.abort(), 12000);

    try {
        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?" + params,
            { signal: controller.signal }
        );

        if (!response.ok) throw new Error("weather");

        const data = await response.json();
        if (id !== requestId) return;

        const current = data.current;
        if (
            !current ||
            !Number.isFinite(current.temperature_2m) ||
            !Number.isFinite(current.weather_code) ||
            ![0, 1].includes(current.is_day) ||
            typeof current.time !== "string"
        ) throw new Error("invalid weather");

        weatherReady = true;
        weatherState = "ready";
        night = current.is_day === 0;
        cloudCover = Number(current.cloud_cover) || 0;
        weatherKind = kindFromCode(current.weather_code);

        document.getElementById("weather-text").textContent =
            `${Math.round(current.temperature_2m)}°C · ${weatherDescription(current.weather_code)} · ${night ? "밤" : "낮"}`;

        const status = document.getElementById("weather-status");
        status.replaceChildren();
        status.append(document.createTextNode(
            `자료 시각 ${current.time.slice(11, 16)} · 한국시간`
        ));
        status.append(document.createElement("br"));

        const source = document.createElement("a");
        source.href = "https://open-meteo.com/";
        source.target = "_blank";
        source.rel = "noopener noreferrer";
        source.textContent = "Weather data by Open-Meteo";
        status.append(source);
        status.append(document.createTextNode(" · 모델 기반"));

        updateCaption();
    } catch (error) {
        if (id !== requestId) return;

        weatherState = "error";
        document.getElementById("weather-text").textContent = "날씨 연결을 확인해 주세요";
        document.getElementById("weather-status").textContent =
            "기본 풍경 표시 중 · 지역을 다시 선택하면 재시도해요.";
        updateCaption();
    } finally {
        clearTimeout(timeout);
    }
}

const artistDialog = document.getElementById("artist-dialog");
const artistPhoto = document.getElementById("artist-photo");
let openedArtist = -1;

function safeURL(value) {
    if (!value) return "";
    try {
        const url = new URL(value, location.href);
        return ["https:", "http:"].includes(url.protocol) ? url.href : "";
    } catch {
        return "";
    }
}

function openArtist(index) {
    const artist = ARTISTS[index];
    if (!artist) return;
    openedArtist = index;

    document.getElementById("artist-name").textContent = artist.name;
    document.getElementById("artist-subtitle").textContent = artist.subtitle;
    document.getElementById("artist-description").textContent = artist.description;
    document.getElementById("artist-profile").textContent = artist.profile || "프로필 준비 중";
    document.getElementById("artist-monogram").textContent = artist.name.slice(0, 2);

    artistPhoto.hidden = true;
    artistPhoto.removeAttribute("src");
    document.getElementById("artist-monogram").hidden = false;

    const photoURL = safeURL(artist.photo);
    if (photoURL) {
        artistPhoto.alt = `${artist.name} 사진`;
        artistPhoto.onload = () => {
            if (openedArtist !== index) return;
            artistPhoto.hidden = false;
            document.getElementById("artist-monogram").hidden = true;
        };
        artistPhoto.onerror = () => {
            if (openedArtist !== index) return;
            artistPhoto.hidden = true;
            document.getElementById("artist-monogram").hidden = false;
        };
        artistPhoto.src = photoURL;
    }

    const songs = document.getElementById("artist-songs");
    songs.replaceChildren();

    if (artist.songs.length) {
        artist.songs.forEach((song, i) => {
            const row = document.createElement("div");
            row.textContent = `${String(i + 1).padStart(2, "0")}  ${song}`;
            songs.append(row);
        });
    } else {
        songs.textContent = "공연곡 준비 중";
    }

    const links = document.getElementById("artist-links");
    links.replaceChildren();

    [
        ["Instagram", artist.instagram],
        ["YouTube", artist.youtube]
    ].forEach(([label, value]) => {
        const href = safeURL(value);
        if (!href) return;

        const link = document.createElement("a");
        link.href = href;
        link.textContent = label;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        links.append(link);
    });

    if (!artistDialog.open) artistDialog.showModal();
}

ARTISTS.forEach((artist, index) => {
    const button = document.createElement("button");
    button.textContent = artist.name;
    button.addEventListener("click", () => openArtist(index));
    document.getElementById("artist-menu").append(button);
});

const TREES = [];

for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 9; col++) {
        const x = (col + 0.25 + rnd(row * 20 + col) * 0.45) / 9;
        const z = 0.12 + row * 0.215 + rnd(row * 15 + col + 88) * 0.07;
        const center = 0.52 + Math.sin(z * 5) * 0.08;

        if (Math.abs(x - center) < 0.145) continue;
        if (z > 0.65 && x > 0.2 && x < 0.78) continue;

        TREES.push({
            x, z,
            seed: row * 83 + col * 17,
            pine: col % 4 === 0
        });
    }
}

const GRASS = Array.from({ length: 1200 }, (_, i) => ({
    x: rnd(i * 3 + 1),
    z: rnd(i * 3 + 2),
    color: i % 3
}));

const FLOWERS = Array.from({ length: 110 }, (_, i) => ({
    x: rnd(i + 800),
    z: 0.14 + rnd(i + 1000) * 0.8,
    id: i
})).filter(f => Math.abs(f.x - (0.52 + Math.sin(f.z * 5) * 0.08)) > 0.1);

const PARTICLES = Array.from({ length: 120 }, (_, i) => ({
    x: rnd(i + 100),
    y: rnd(i + 300),
    size: 2 + rnd(i + 500) * 4,
    speed: 0.0004 + rnd(i + 700) * 0.0008,
    phase: rnd(i + 900) * 6.28
}));

function drawTree(tree) {
    const p = point(tree.x, tree.z);
    const s = p.s;
    const theme = THEMES[season];

    oval(p.x, p.y + 2 * s, 47 * s, 12 * s, "#294c3624");

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(s, s);

    ctx.fillStyle = "#a67f51";
    ctx.beginPath();
    ctx.moveTo(-12, -90);
    ctx.lineTo(12, -90);
    ctx.lineTo(15, -15);
    ctx.lineTo(27, 0);
    ctx.lineTo(10, -3);
    ctx.lineTo(3, 3);
    ctx.lineTo(-8, -3);
    ctx.lineTo(-25, 0);
    ctx.lineTo(-12, -16);
    ctx.closePath();
    ctx.fill();

    line(-3, -76, -1, -14, "#c5a06b", 7);
    line(9, -52, 10, -25, "#88683f70", 3);

    const sway = reduced ? 0 : Math.sin(tick * 0.012 + tree.seed) * 1.7;

    if (tree.pine) {
        for (let j = 0; j < 4; j++) {
            const y = -65 - j * 27;
            const r = 57 - j * 10;

            ctx.fillStyle = theme.pine[j % 3];
            ctx.beginPath();
            ctx.moveTo(sway, y - 62);
            ctx.quadraticCurveTo(r * 0.5, y - 25, r, y);
            ctx.quadraticCurveTo(0, y + 18, -r, y);
            ctx.quadraticCurveTo(-r * 0.5, y - 25, sway, y - 62);
            ctx.fill();

            if (season === 3 || weatherKind === "snow") {
                ctx.fillStyle = j % 2 ? "#fcfefe" : "#e6eff2";
                ctx.beginPath();
                ctx.moveTo(sway, y - 62);
                ctx.lineTo(r * 0.78, y - 12);
                ctx.quadraticCurveTo(0, y + 3, -r * 0.78, y - 12);
                ctx.closePath();
                ctx.fill();
            }
        }
    } else {
        oval(sway, -116, 63, 56, theme.leaves[2]);

        for (let j = 0; j < 70; j++) {
            const angle = rnd(tree.seed + j * 3) * Math.PI * 2;
            const radius = Math.sqrt(rnd(tree.seed + j * 5 + 9));
            const size = 10 + rnd(tree.seed + j + 2) * 8;

            oval(
                Math.cos(angle) * 57 * radius + sway,
                -121 + Math.sin(angle) * 49 * radius,
                size, size * 0.85, theme.leaves[j % 4]
            );
        }

        if (weatherKind === "snow" && season !== 3) {
            oval(0, -160, 40, 13, "#eef7f9");
        }

        if (season === 1) {
            [[-30, -118], [29, -132], [7, -88]].forEach(([x, y]) => {
                line(x, y, x + 2, y - 13, "#6c5d35", 3);
                oval(x, y, 10, 11, "#d94f3b");
                oval(x - 3, y - 4, 3, 4, "#ff9c72");
                oval(x + 6, y - 10, 6, 3, "#427c42");
            });
        }
    }

    ctx.restore();
}

function drawRiver() {
    const left = [], right = [];

    for (let i = 0; i <= 60; i++) {
        const z = i / 60;
        const center = 0.52 + Math.sin(z * 5) * 0.08;
        left.push(point(center - 0.065, z));
        right.push(point(center + 0.065, z));
    }

    ctx.beginPath();
    left.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    right.reverse().forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();

    ctx.strokeStyle = season === 3 ? "#bfd7df" : "#d7bd7c";
    ctx.lineWidth = 16;
    ctx.lineJoin = "round";
    ctx.stroke();

    const gradient = ctx.createLinearGradient(0, H * 0.3, 0, H);
    gradient.addColorStop(0, season === 3 ? "#b5dbe4" : "#81d0d8");
    gradient.addColorStop(1, season === 3 ? "#83b7cd" : "#4aafc5");
    ctx.fillStyle = gradient;
    ctx.fill();

    for (let i = 0; i < 35; i++) {
        const z = rnd(i + 100);
        const center = 0.52 + Math.sin(z * 5) * 0.08;
        const p = point(center + (rnd(i + 34) - 0.5) * 0.09, z);

        box(
            p.x + Math.sin(tick * 0.015 + i) * 5,
            p.y, 12 + p.s * 15, 2, 1, "#ffffff65"
        );
    }
}

function drawBridge() {
    const z = 0.54;
    const center = 0.52 + Math.sin(z * 5) * 0.08;
    const p = point(center, z);

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(p.s, p.s);

    oval(0, 18, 105, 20, "#27483925");
    box(-103, -10, 206, 39, 6, "#92734e");

    for (let i = 0; i < 12; i++) {
        box(-100 + i * 17, -12, 15, 36, 2, i % 2 ? "#c8a777" : "#b99969");
    }

    for (const y of [-25, 20]) {
        for (const x of [-102, -51, 0, 51, 102]) {
            box(x - 4, y - 33, 8, 40, 3, "#96724a");
            oval(x, y - 33, 6, 4, "#d7b98a");
        }

        ctx.strokeStyle = "#c9ab7e";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(-102, y - 21);
        ctx.quadraticCurveTo(0, y - 44, 102, y - 21);
        ctx.stroke();
    }

    ctx.restore();
}

function drawFlower(flower) {
    const p = point(flower.x, flower.z);
    const s = p.s;
    const id = flower.id;

    if (season === 3 || weatherKind === "snow") {
        oval(p.x, p.y, 6 * s, 2 * s, "#ffffffa0");
        return;
    }

    if (season === 2) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(id);
        oval(0, 0, 6 * s, 3 * s, id % 2 ? "#b67a3e" : "#e8c978");
        ctx.restore();
        return;
    }

    line(p.x, p.y, p.x, p.y - 13 * s, "#568746", 2 * s);
    oval(p.x - 3 * s, p.y - 5 * s, 5 * s, 2 * s, "#568746");

    const color = ["#fff4dc", "#f2a8bc", "#efda73", "#ec8966"][id % 4];

    for (let j = 0; j < 5; j++) {
        const a = j * Math.PI * 2 / 5;
        oval(
            p.x + Math.cos(a) * 4 * s,
            p.y - 15 * s + Math.sin(a) * 4 * s,
            4 * s, 4 * s, color
        );
    }

    oval(p.x, p.y - 15 * s, 2.5 * s, 2.5 * s, "#c9a34d");
}

function drawResident(artist, index) {

    oval(p.x, p.y + 4 * s, 25 * s, 8 * s, "#38513d2b");

    ctx.save();
    ctx.translate(p.x, p.y + bounce);

    oval(-11, -5, 8, 5, artist.type === "dog" ? "#f4eddf" : "#735b41");
    oval(11, -5, 8, 5, artist.type === "dog" ? "#f4eddf" : "#735b41");

    oval(
        0, -28, 21, 26,
        artist.type === "dog" ? "#f6eee0" :
        artist.type === "yellow" ? "#8baf82" : "#92b4b3"
    );

    if (artist.type !== "dog") {
        for (let i = 0; i < 4; i++) {
            line(-16, -41 + i * 9, 16, -41 + i * 9, "#ffffff55", 3);
        }
    }

    oval(-23, -27, 7, 14, artist.color);
    oval(23, -27, 7, 14, artist.color);

    if (artist.type === "yellow") {

        oval(23, -75, 10, 23, "#c59b43");

    } else if (artist.type === "raccoon") {

    } else {
        oval(-24, -72, 10, 23, "#ded4c5");

    oval(0, -65, 29, 29, artist.color);

    if (artist.type === "raccoon") {
        oval(-12, -65, 12, 9, "#685444");
        oval(12, -65, 12, 9, "#685444");
    }

    oval(0, -52, 17, 12, artist.type === "yellow" ? "#f4e0a3" : "#fff5e3");
    oval(-11, -65, 3.3, 4.7, "#3b3931");
    oval(11, -65, 3.3, 4.7, "#3b3931");
    oval(-12, -67, 1, 1.5, "#ffffff");
    oval(10, -67, 1, 1.5, "#ffffff");
    oval(0, -55, 4.3, 3, "#4c4439");

    ctx.strokeStyle = "#655142";
    ctx.lineWidth = 1.5;
    ctx.beginPath();

        ctx.translate(4, -24);
        ctx.rotate(-0.4);

        oval(-7, 0, 14, 17, "#bd894d");

        box(4, -43, 7, 36, 2, "#855c37");
        oval(1, -8, 5, 6, "#584b3c");

        for (let i = 0; i < 3; i++) {
            line(5 + i * 1.5, -41, 2 + i * 1.5, 10, "#f2dba3", 0.7);
        }

        ctx.restore();
    }

    oval(-19, -55, 5, 3, "#e69e8a65");
    oval(19, -55, 5, 3, "#e69e8a65");

    ctx.restore();

    /* 캐릭터 이름표 */
    ctx.save();

    const labelWidth = Math.max(68, ctx.measureText(artist.name).width + 22);

    box(p.x - labelWidth / 2, labelY, labelWidth, 24, 12, "#fffbeded");

    ctx.restore();

    residentHits.push({
        x: p.x,
        y: p.y,
        s,
        labelWidth,
        index
    });
}

function drawDecorations() {
    const p = point(0.19, 0.91);
    const s = p.s;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(s, s);
    ctx.transform(1, 0.06, -0.3, 0.5, 0, 0);

    box(-52, -30, 104, 70, 3, "#f2e4c9");

    for (let x = 0; x < 6; x++) {
        for (let y = 0; y < 4; y++) {
            if ((x + y) % 2 === 0) {
                ctx.fillStyle = season === 3 ? "#91afb6" : "#bb8374";
                ctx.fillRect(-50 + x * 17, -28 + y * 17, 17, 17);
            }
        }
    }

    ctx.restore();

    oval(p.x, p.y - 7 * s, 18 * s, 7 * s, "#9b7446");
    box(p.x - 18 * s, p.y - 22 * s, 36 * s, 16 * s, 4 * s, "#be955e");

    for (let i = 0; i < 6; i++) {
        const m = point(0.07 + rnd(i + 400) * 0.17, 0.5 + rnd(i + 500) * 0.45);

        box(m.x - 3 * m.s, m.y - 14 * m.s, 6 * m.s, 15 * m.s, 2 * m.s, "#efdfbf");
        oval(
            m.x, m.y - 15 * m.s, 11 * m.s, 7 * m.s,
            season === 2 ? "#bd6951" : "#b9966b"
        );
        oval(m.x - 3 * m.s, m.y - 17 * m.s, 2 * m.s, 2 * m.s, "#fff0d2");
    }
}

function drawSky() {
    const cloudy = ["rain", "storm"].includes(weatherKind) || cloudCover > 75;
    const colors = night
        ? ["#192e49", "#647c91"]
        : cloudy
        ? ["#8eabb9", "#d1dce0"]
        : THEMES[season].sky;

    const gradient = ctx.createLinearGradient(0, 0, 0, H * 0.55);
    gradient.addColorStop(0, colors[0]);
    gradient.addColorStop(1, colors[1]);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    if (night && cloudCover < 65) {
        for (let i = 0; i < 45; i++) {
            const alpha = 0.4 + Math.sin(tick * 0.02 + i) * 0.15;
            oval(
                rnd(i + 9) * W,
                rnd(i + 28) * H * 0.32,
                1.2, 1.2,
                `rgba(255,250,218,${alpha})`
            );
        }
    }

    if (!cloudy) {
        oval(W * 0.7, H * 0.13, 27, 27, night ? "#fff4cc" : "#fff0b5");
        if (night) {
            oval(W * 0.7 + 10, H * 0.13 - 7, 25, 25, colors[0]);
        }
    }

    for (let i = 0; i < 6; i++) {
        const x = W * (i * 0.21 - 0.04) + Math.sin(tick * 0.001 + i) * 20;
        const y = H * (0.16 + (i % 3) * 0.045);
        const color = night ? "#9fb1c13b" : cloudy ? "#e3ebedb0" : "#ffffffab";

        oval(x, y, 55, 13, color);
        oval(x - 16, y - 8, 26, 18, color);
        oval(x + 19, y - 7, 24, 15, color);
    }
}

function drawAtmosphere(dt) {
    const rain = ["rain", "storm"].includes(weatherKind);
    const snow = weatherKind === "snow";
    const count = rain ? 110 : snow ? 90 : season === 1 ? 18 : 45;

    for (let i = 0; i < count; i++) {
        const p = PARTICLES[i];

        if (!reduced) {
            p.y += p.speed * dt * (rain ? 6 : 1);
            if (p.y > 1.05) p.y = -0.05;
        }

        const x = p.x * W + Math.sin(tick * 0.01 + p.phase) * (rain ? 4 : 25);
        const y = p.y * H;

        if (rain) {
            line(x, y, x - 4, y + 13, "#d8ecf077", 1);
        } else if (snow) {
            oval(x, y, p.size * 0.65, p.size * 0.65, "#ffffffd9");
        } else if (season === 1) {
            if (night) oval(x, y, 2, 2, "#f5ee9d9c");
        } else {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(tick * 0.009 + p.phase);
            oval(
                0, 0, p.size, p.size * (season === 3 ? 1 : 0.45),
                season === 0 ? "#ffe4edcc" :
                season === 2 ? "#d79756cc" : "#ffffff9c"
            );
            ctx.restore();
        }
    }

    if (weatherKind === "fog") {
        ctx.fillStyle = "#e9eff166";
        ctx.fillRect(0, H * 0.25, W, H * 0.75);
    }
}

const SCENE_OBJECTS = [
    ...TREES.map(tree => ({
        z: tree.z,
        draw: () => drawTree(tree)
    })),
    { z: 0.54, draw: drawBridge },
    { z: 0.88, draw: drawDecorations },
    ...ARTISTS.map((artist, index) => ({
        z: artist.z,
        draw: () => drawResident(artist, index)
    }))
].sort((a, b) => a.z - b.z);

function render(time) {
    const dt = Math.min((time - previousTime) / 16.67 || 1, 2);
    previousTime = time;

    if (!reduced) tick += dt;
    residentHits = [];

    const theme = THEMES[season];
    drawSky();

    ctx.fillStyle = season === 3 ? "#c9dce0" : "#91b79a";
    ctx.beginPath();
    ctx.moveTo(0, H * 0.38);
    ctx.bezierCurveTo(W * 0.2, H * 0.2, W * 0.3, H * 0.37, W * 0.5, H * 0.29);
    ctx.bezierCurveTo(W * 0.7, H * 0.19, W * 0.85, H * 0.32, W, H * 0.25);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();

    ctx.fillStyle = theme.ground;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.39);
    ctx.quadraticCurveTo(W * 0.5, H * 0.27, W, H * 0.38);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();

    GRASS.forEach(grass => {
        const p = point(grass.x, grass.z);
        ctx.fillStyle = theme.grass[grass.color];
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 2 * p.s, p.y - 4 * p.s);
        ctx.lineTo(p.x + 4 * p.s, p.y - 2 * p.s);
        ctx.closePath();
        ctx.fill();
    });

    drawRiver();
    FLOWERS.forEach(drawFlower);
    SCENE_OBJECTS.forEach(object => object.draw());

    if (night) {
        ctx.fillStyle = "#17355e66";
        ctx.fillRect(0, H * 0.3, W, H * 0.7);
    } else if (["rain", "storm"].includes(weatherKind)) {
        ctx.fillStyle = "#415b711f";
        ctx.fillRect(0, H * 0.3, W, H * 0.7);
    }

    drawAtmosphere(dt);
    requestAnimationFrame(render);
}

function hitResident(x, y) {
    return [...residentHits].reverse().find(hit => {
        const body =
            Math.abs(x - hit.x) < 38 * hit.s &&
            y > hit.y - 108 * hit.s &&
            y < hit.y + 12 * hit.s;

        const label =
            Math.abs(x - hit.x) < hit.labelWidth / 2 &&
            y >= hit.y + 12 &&
            y <= hit.y + 36;

        return body || label;
    });
}

canvas.addEventListener("pointerdown", event => {
    const hit = hitResident(event.clientX, event.clientY);
    if (hit) openArtist(hit.index);
});

canvas.addEventListener("pointermove", event => {
    canvas.style.cursor = hitResident(event.clientX, event.clientY) ? "pointer" : "default";
});

/* 시작 */
season = actualSeason();
updateSeasonUI();
updateClock();
setInterval(updateClock, 10000);
loadWeather();
requestAnimationFrame(render);
</script>
