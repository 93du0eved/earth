<script>
/* 투명 배경 kk.png 전체 사용 */
DOG_CROP.x = 0;
DOG_CROP.y = 0;
DOG_CROP.w = 1;
DOG_CROP.h = 1;

dog.src = "./kk.png";

/* 메뉴와 게임 제목 */
document.getElementById("game-open").textContent =
    "KK와 함께 음표 찾기";

document.getElementById("game-title").textContent =
    "KK와 함께 음표 찾기";

document.querySelector("#game-dialog .dialog-head .small").textContent =
    "KK가 연주할 음표를 함께 찾아주세요.";

/* 숲에 표시되는 캐릭터 이름표 */
const originalLabel = label;

label = function(text, x, y) {
    if (text === "기타 강아지 · 게임") {
        text = "KK와 함께 음표 찾기";
    }

    return originalLabel(text, x, y);
};

/* 게임 시작 전 안내 */
const originalPrepareGame = prepareGame;

prepareGame = function() {
    originalPrepareGame();

    document.getElementById("result-title").textContent =
        "KK와 함께 음표 찾기";

    document.getElementById("result-text").textContent =
        "KK가 연주할 음표를 찾아주세요. 30초 동안 15개를 모으면 성공이에요.";
};

/* 게임 종료 안내 */
const originalFinishGame = finishGame;

finishGame = function(success) {
    originalFinishGame(success);

    document.getElementById("result-title").textContent =
        success
            ? "KK와 함께 멜로디 완성!"
            : "KK와 한 번 더 도전해 볼까요?";

    document.getElementById("result-text").textContent =
        success
            ? "음표를 모두 찾았어요! KK와 함께 계절의 멜로디를 완성했어요. 아래에서 이벤트 참여 폼도 확인해 주세요."
            : `음표 ${score}개를 찾았어요. 다시 도전하거나 아래에서 이벤트 참여 폼을 확인해 주세요.`;
};
</script>
