<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리의 사계절</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#b6d8e6;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#655842}
canvas{display:block;width:100%;height:100dvh}
.top{position:fixed;top:28px;left:32px;pointer-events:none}
.top small{font-size:11px;letter-spacing:4px;color:#fff;text-shadow:0 2px 5px #456653}
.top h1{font-size:30px;color:#fffdf0;margin:8px 0;text-shadow:0 3px 0 #688264}
.top p{color:#fff;font-size:13px;text-shadow:0 2px 5px #456653}
.clock{position:fixed;top:28px;right:30px;background:#fff9e6ed;border:3px solid #fffdf2;border-radius:23px;padding:14px 22px;box-shadow:0 5px 0 #52674a20;font-weight:bold;font-size:20px}
.clock small{display:block;font-size:11px;letter-spacing:1px;margin-top:5px;text-align:center}
.bottom{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);width:max-content;max-width:95%;text-align:center}
.caption{display:inline-block;padding:12px 25px;margin-bottom:15px;background:#fffbedee;border:3px solid #fff;border-radius:25px;font-size:14px;box-shadow:0 4px 0 #555a3d15}
.seasons{display:flex;gap:8px;padding:9px;background:#fffbedeb;border:3px solid #fff;border-radius:40px;box-shadow:0 7px 0 #555a3d20}
button{border:0;border-radius:25px;background:transparent;color:#796b50;font:inherit;font-weight:bold;padding:12px 22px;cursor:pointer;transition:background .2s,transform .2s}
button:hover{transform:translateY(-3px)}
button.active{background:#7da478;color:white;box-shadow:0 3px 0 #476c4e25}
button:focus-visible{outline:3px solid #b47e51;outline-offset:3px}
.hint{position:fixed;left:25px;bottom:25px;color:#fff;font-size:12px;text-shadow:0 1px 4px #466346}
@media(max-width:600px){
.top{top:22px;left:20px}.top h1{font-size:24px}.top p{font-size:11px}
.clock{right:15px;top:20px;padding:10px 13px;font-size:17px}
button{padding:12px 15px}.bottom{bottom:22px}.hint{display:none}
.caption{font-size:12px;padding:10px 18px}
}
</style>
</head>
<body>
<canvas id="world" aria-label="계절에 따라 변하는 입체적인 숲 풍경"></canvas>

<div class="top">
    <small>OUR LITTLE SEASONS</small>
    <h1>우리의 사계절</h1>
    <p>같은 자리에서 만나는, 네 번의 다른 풍경</p>
</div>

<div class="clock">
    <span id="time"></span>
    <small id="date"></small>
</div>

<div class="bottom">
    <div class="caption" id="caption" aria-live="polite">분홍빛 꽃잎이 내려앉는 봄날이에요.</div>
    <div class="seasons" aria-label="계절 선택">
        <button class="active" data-season="0" aria-pressed="true">🌸 봄</button>
        <button data-season="1" aria-pressed="false">🌿 여름</button>
        <button data-season="2" aria-pressed="false">🍁 가을</button>
        <button data-season="3" aria-pressed="false">❄️ 겨울</button>
    </div>
</div>

<div class="hint">나무를 누르면 작은 선물이 떨어져요.</div>

<script>
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let width, height, ratio, season = 0, frame = 0;
let hitTrees = [], gifts = [];

const palettes = [
    {
        sky:["#94ccec","#e3f1e6"], ground:"#8fc661",
        grass:["#6cac54","#a9d578","#cae28a"],
        leaves:["#f6bdcf","#ffd9e0","#eea8bf","#ffe9e6"],
        pine:["#549372","#397e65","#6da384"],
        river:["#77cedb","#52b5cd"],
        caption:"분홍빛 꽃잎이 내려앉는 봄날이에요."
    },
    {
        sky:["#6eb8ee","#d1edf0"], ground:"#72b74d",
        grass:["#4e9b42","#92ca61","#b8d679"],
        leaves:["#479454","#72b464","#39824e","#92c67a"],
        pine:["#327b5d","#25664f","#459267"],
        river:["#55c9dd","#39aaca"],
        caption:"초록 잎 사이로 여름 바람이 불어와요."
    },
    {
        sky:["#adcfe2","#f9e6ba"], ground:"#cdb268",
        grass:["#b2954f","#dec580","#e4b665"],
        leaves:["#ce7640","#e59b4e","#c65b3a","#f0bd62"],
        pine:["#71814e","#596c42","#88944f"],
        river:["#83c9cd","#62afb9"],
        caption:"바스락, 발끝마다 가을이 쌓여요."
    },
    {
        sky:["#8daecb","#e1e8ef"], ground:"#e6eef0",
        grass:["#c5d7df","#f8fcfc","#d5e3e9"],
        leaves:["#ecf4f6","#ffffff","#d6e5ed","#f6fafb"],
        pine:["#5c8b85","#45716d","#81a29a"],
        river:["#9bcbdc","#7bb5cf"],
        caption:"하얀 눈이 숲을 포근하게 덮었어요."
    }
];

function random(seed){
    let x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
}

function resize(){
    width = innerWidth;
    height = innerHeight;
    ratio = Math.min(devicePixelRatio || 1, 2);
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    ctx.setTransform(ratio,0,0,ratio,0,0);
}
addEventListener("resize",resize);
resize();

function ellipse(x,y,rx,ry,color){
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
    ctx.fill();
}

function rounded(x,y,w,h,r,color){
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
    ctx.fill();
}

function project(x,z){
    const depth = .22 + z * .78;
    return {
        x:width/2 + (x-.5)*width*(.62+z*.65),
        y:height*.31 + z*height*.6,
        s:Math.min(width/1100,height/750)*(.4+z*.95),
        depth
    };
}

const trees = [];
for(let row=0;row<4;row++){
    for(let col=0;col<8;col++){
        const x = (col+.3+random(row*19+col)*.4)/8;
        const z = .12+row*.21+random(row*12+col+82)*.09;
        const riverCenter = .5+Math.sin(z*5)*.09;
        if(Math.abs(x-riverCenter)<.13) continue;
        if(row===3 && x>.35 && x<.8) continue;
        trees.push({x,z,seed:row*70+col*13,pine:col%4===0});
    }
}
trees.sort((a,b)=>a.z-b.z);

function drawTree(tree){
    const p=project(tree.x,tree.z);
    const s=p.s;
    const x=p.x,y=p.y;
    const colors=palettes[season];
    const sway=reduced?0:Math.sin(frame*.013+tree.seed)*2*s;
    ellipse(x,y+3*s,48*s,13*s,"#345b3b25");

    ctx.save();
    ctx.translate(x,y);
    ctx.scale(s,s);

    ctx.fillStyle="#a57c4b";
    ctx.beginPath();
    ctx.moveTo(-12,-85);ctx.lineTo(13,-85);
    ctx.lineTo(16,-12);ctx.lineTo(29,0);
    ctx.lineTo(12,-2);ctx.lineTo(4,3);
    ctx.lineTo(-7,-3);ctx.lineTo(-28,1);
    ctx.lineTo(-13,-15);ctx.closePath();ctx.fill();

    ctx.fillStyle="#c49a60";
    ctx.beginPath();
    ctx.moveTo(-7,-85);ctx.lineTo(2,-85);
    ctx.lineTo(6,-13);ctx.lineTo(13,-3);
    ctx.lineTo(1,-8);ctx.lineTo(-6,-1);
    ctx.closePath();ctx.fill();

    ctx.strokeStyle="#89673e55";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(9,-57);ctx.lineTo(10,-26);ctx.stroke();

    if(tree.pine){
        for(let j=0;j<4;j++){
            const yy=-68-j*29;
            const r=58-j*10;
            ctx.fillStyle=colors.pine[j%3];
            ctx.beginPath();
            ctx.moveTo(sway,yy-65);
            ctx.quadraticCurveTo(r*.5,yy-28,r,yy);
            ctx.quadraticCurveTo(0,yy+18,-r,yy);
            ctx.quadraticCurveTo(-r*.4,yy-30,sway,yy-65);
            ctx.fill();
            if(season===3){
                ctx.fillStyle=j%2?"#f8fcfd":"#e6f0f4";
                ctx.beginPath();
                ctx.moveTo(sway,yy-65);
                ctx.lineTo(r*.76,yy-12);
                ctx.quadraticCurveTo(0,yy+2,-r*.76,yy-12);
                ctx.closePath();ctx.fill();
            }
        }
    }else{
        ellipse(sway,-112,65,59,colors.leaves[2]);
        for(let j=0;j<100;j++){
            const angle=random(tree.seed+j*3)*Math.PI*2;
            const r=Math.sqrt(random(tree.seed+j*5+9));
            const lx=Math.cos(angle)*59*r+sway;
            const ly=-119+Math.sin(angle)*51*r;
            const size=10+random(j+tree.seed+4)*9;
            ellipse(lx,ly,size,size*.8,colors.leaves[j%4]);
        }
        if(season===1){
            [[-32,-113],[28,-131],[8,-85]].forEach(([ax,ay])=>{
                ctx.strokeStyle="#76633b";ctx.lineWidth=3;
                ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+2,ay-12);ctx.stroke();
                ellipse(ax,ay,10,11,"#d94d39");
                ellipse(ax-3,ay-4,3,4,"#f98b61");
                ellipse(ax+6,ay-10,6,3,"#537b3c");
            });
        }
    }
    ctx.restore();
    hitTrees.push({x,y,r:65*s,top:y-150*s});
}

function river(){
    const p=palettes[season];
    const gradient=ctx.createLinearGradient(0,height*.3,0,height);
    gradient.addColorStop(0,p.river[0]);
    gradient.addColorStop(1,p.river[1]);

    const left=[],right=[];
    for(let i=0;i<=60;i++){
        const z=i/60;
        const center=.5+Math.sin(z*5)*.09;
        left.push(project(center-.065,z));
        right.push(project(center+.065,z));
    }
    ctx.beginPath();
    left.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    right.reverse().forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.closePath();

    ctx.strokeStyle=season===3?"#c4d9dd":"#d5bf80";
    ctx.lineWidth=18;
    ctx.lineJoin="round";
    ctx.stroke();
    ctx.fillStyle=gradient;ctx.fill();

    for(let i=0;i<38;i++){
        const z=random(i+70);
        const center=.5+Math.sin(z*5)*.09;
        const p=project(center+(random(i+15)-.5)*.09,z);
        const movement=reduced?0:Math.sin(frame*.018+i)*5;
        rounded(p.x+movement,p.y,12+p.s*20,2,1,"#ffffff55");
    }
}

function bridge(){
    const z=.58;
    const center=.5+Math.sin(z*5)*.09;
    const p=project(center,z),s=p.s;
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);
    ellipse(0,17,110,20,"#244a3d25");
    rounded(-105,-10,210,43,8,"#98774f");
    for(let i=0;i<12;i++){
        rounded(-100+i*17,-11,15,37,2,i%2?"#c2a173":"#b99869");
    }
    for(const yy of [-26,22]){
        for(const xx of [-103,-52,0,52,103]){
            rounded(xx-5,yy-35,10,42,3,"#957047");
            ellipse(xx,yy-35,7,4,"#d7ba87");
        }
        ctx.strokeStyle="#d1b183";ctx.lineWidth=8;
        ctx.beginPath();ctx.moveTo(-104,yy-22);
        ctx.quadraticCurveTo(0,yy-48,104,yy-22);ctx.stroke();
    }
    ctx.restore();
}

function flower(x,z,seed){
    const p=project(x,z),s=p.s;
    if(season===3){
        ellipse(p.x,p.y,7*s,3*s,"#ffffffb0");
        return;
    }
    if(season===2){
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(seed);
        ellipse(0,0,6*s,3*s,seed%2?"#b8773e":"#e9ca68");
        ctx.restore();return;
    }
    ctx.strokeStyle="#568c42";ctx.lineWidth=2*s;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-13*s);ctx.stroke();
    ellipse(p.x-4*s,p.y-5*s,5*s,2*s,"#5d9849");
    const color=["#fff5dc","#f4abbb","#f3d562","#ed825d"][seed%4];
    for(let j=0;j<5;j++){
        const a=j*Math.PI*2/5;
        ellipse(p.x+Math.cos(a)*4*s,p.y-14*s+Math.sin(a)*4*s,4*s,4*s,color);
    }
    ellipse(p.x,p.y-14*s,2.5*s,2.5*s,"#e5b850");
}

function picnic(){
    const p=project(.28,.84),s=p.s;
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);
    ctx.transform(1,.06,-.35,.55,0,0);
    rounded(-65,-40,130,90,3,season===3?"#8caaad":"#f4e1ca");
    for(let x=0;x<7;x++)for(let y=0;y<5;y++){
        if((x+y)%2===0)ctx.fillStyle=season===3?"#d6e6e7":"#ce8b7e";
        else ctx.fillStyle=season===3?"#8caaad":"#f4e1ca";
        ctx.fillRect(-63+x*18,-38+y*17,18,17);
    }
    ctx.restore();
    ellipse(p.x,p.y-8*s,20*s,8*s,"#ad8050");
    rounded(p.x-20*s,p.y-27*s,40*s,19*s,5*s,"#c69c62");
    ctx.strokeStyle="#a87d4c";ctx.lineWidth=4*s;
    ctx.beginPath();ctx.ellipse(p.x,p.y-26*s,12*s,13*s,0,Math.PI,Math.PI*2);ctx.stroke();
    ellipse(p.x+35*s,p.y+4*s,12*s,5*s,"#fff9e9");
    ellipse(p.x+35*s,p.y,6*s,7*s,"#d7b985");
}

const particles=Array.from({length:65},(_,i)=>({
    x:random(i+17),y:random(i+170),s:2+random(i+390)*5,
    speed:.0003+random(i+11)*.0007,phase:random(i+50)*6.28
}));

function draw(){
    frame++;
    hitTrees=[];
    const p=palettes[season];
    ctx.clearRect(0,0,width,height);

    let sky=ctx.createLinearGradient(0,0,0,height*.5);
    sky.addColorStop(0,p.sky[0]);sky.addColorStop(1,p.sky[1]);
    ctx.fillStyle=sky;ctx.fillRect(0,0,width,height);

    ellipse(width*.76,height*.15,35,35,season===3?"#f7f3dd":"#fff0b3");
    for(let i=0;i<5;i++){
        const cx=width*(.1+i*.23)+(reduced?0:Math.sin(frame*.001+i)*20);
        const cy=height*(.15+(i%2)*.055);
        ellipse(cx,cy,55,12,"#ffffffb0");
        ellipse(cx-15,cy-9,27,18,"#ffffffb0");
        ellipse(cx+17,cy-6,23,15,"#ffffffb0");
    }

    ctx.fillStyle=season===3?"#c4d9d8":"#91b998";
    ctx.beginPath();ctx.moveTo(0,height*.37);
    ctx.bezierCurveTo(width*.2,height*.18,width*.27,height*.35,width*.5,height*.29);
    ctx.bezierCurveTo(width*.75,height*.18,width*.85,height*.3,width,height*.23);
    ctx.lineTo(width,height);ctx.lineTo(0,height);ctx.fill();

    ctx.fillStyle=p.ground;
    ctx.beginPath();ctx.moveTo(0,height*.38);
    ctx.quadraticCurveTo(width*.5,height*.28,width,height*.37);
    ctx.lineTo(width,height);ctx.lineTo(0,height);ctx.fill();

    for(let i=0;i<1900;i++){
        const x=random(i*3+1),z=random(i*3+2);
        const q=project(x,z);
        ctx.fillStyle=p.grass[i%3];
        ctx.beginPath();
        ctx.moveTo(q.x,q.y);
        ctx.lineTo(q.x-2*q.s,q.y-4*q.s);
        ctx.lineTo(q.x+4*q.s,q.y-2*q.s);
        ctx.closePath();ctx.fill();
    }

    river();

    for(let i=0;i<155;i++){
        const x=random(i+580),z=.14+random(i+780)*.83;
        if(Math.abs(x-(.5+Math.sin(z*5)*.09))<.1)continue;
        flower(x,z,i);
    }

    let bridgeDrawn=false,picnicDrawn=false;
    for(const tree of trees){
        if(tree.z>.58&&!bridgeDrawn){bridge();bridgeDrawn=true}
        if(tree.z>.84&&!picnicDrawn){picnic();picnicDrawn=true}
        drawTree(tree);
    }
    if(!bridgeDrawn)bridge();
    if(!picnicDrawn)picnic();

    for(const a of particles){
        if(!reduced){
            a.y+=a.speed;
            if(a.y>1.05)a.y=-.05;
        }
        const x=a.x*width+Math.sin(frame*.012+a.phase)*25;
        const y=a.y*height;
        if(season===1){
            ellipse(x,y,a.s*.4,a.s*.4,"#fff8c650");
        }else{
            ctx.save();ctx.translate(x,y);ctx.rotate(frame*.012+a.phase);
            ellipse(0,0,a.s,season===3?a.s:a.s*.45,
                season===0?"#ffe2ead9":season===2?"#da8d49cc":"#ffffffe0");
            ctx.restore();
        }
    }

    gifts=gifts.filter(g=>g.life>0);
    for(const g of gifts){
        if(!reduced){g.y+=g.vy;g.vy+=.12}
        g.life--;
        ctx.globalAlpha=Math.min(1,g.life/25);
        ctx.font="25px sans-serif";
        ctx.textAlign="center";
        ctx.fillText(g.icon,g.x,g.y);
        ctx.globalAlpha=1;
    }

    requestAnimationFrame(draw);
}
draw();

document.querySelectorAll("[data-season]").forEach(button=>{
    button.addEventListener("click",()=>{
        season=Number(button.dataset.season);
        document.querySelectorAll("[data-season]").forEach(b=>{
            const active=b===button;
            b.classList.toggle("active",active);
            b.setAttribute("aria-pressed",String(active));
        });
        document.getElementById("caption").textContent=palettes[season].caption;
    });
});

canvas.addEventListener("pointerdown",event=>{
    const tree=[...hitTrees].reverse().find(t=>
        Math.abs(event.clientX-t.x)<t.r &&
        event.clientY>t.top-t.r*.5 &&
        event.clientY<t.y
    );
    if(!tree)return;
    for(let i=0;i<3;i++){
        gifts.push({
            x:tree.x+(i-1)*20,y:tree.top,
            vy:-2-i*.4,life:100,
            icon:["🌸","🍎","🍂","❄️"][season]
        });
    }
});

function updateClock(){
    const now=new Date();
    document.getElementById("time").textContent=
        now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
    document.getElementById("date").textContent=
        now.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"});
}
updateClock();
setInterval(updateClock,10000);
</script>
</body>
</html>
